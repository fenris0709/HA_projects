# ESPHome: ESP32-C3 SuperMini + 1x TOF200C (VL53L0X, 2 m) + 18650, Deep Sleep. EIN Sensor pro Tank, EIN Geraet pro Tank.
# Hardware siehe ../README.md
#
# Zweites Geraet: nur "sn" (und die Tankwerte) unten aendern, neu flashen. Der Name unter "sn" ist der
# veroeffentlichte Name (Geraet, MQTT-Topic, Home Assistant), sonst unterscheiden sich die Geraete nicht.
#
# Ablauf pro Wachphase:
#   (WLAN noch aus) Sensor per XSHUT aufwecken -> N Messungen, Median -> Akkuspannung
#   -> WLAN ein -> MQTT verbinden -> Werte (retained) publishen -> Deep Sleep
# Im Deep Sleep floatet XSHUT, der Pulldown Rxs am Lochraster haelt den Sensor im Standby.
# Home Assistant legt die Sensoren per MQTT-Discovery automatisch an.
# OTA (Firmware-Update per WLAN): retained "ON" auf ${name}/ota_mode publishen, dann bleibt das
#      Geraet nach der naechsten Wachphase wach (max. 30 min). "OFF" -> sofort Deep Sleep.
# Schlafdauer: retained Zahl (Minuten, 1..1440) auf ${name}/sleep_minutes. Gilt ab der naechsten Wachphase.
# Rueckmeldung: Sensoren "Schlafdauer aktiv" (Minuten) und "Modus" (Normal / OTA aktiv) zeigen, was wirklich gilt.
# Nach dem Timer-Aufwachen wartet es max. 30 s auf den Broker, nach Einschalten/RST 60 s.

substitutions:
  sn: "01"                       # Seriennummer / Tankkennung: macht Name und MQTT-Topic eindeutig (z. B. "01", "02")
  name: tankmonitor-${sn}        # Geraetename und MQTT-Topic-Prefix (klein, ohne Leerzeichen)
  friendly_name: Tankmonitor ${sn}
  sleep_default_min: "60"        # Minuten, solange kein ${name}/sleep_minutes gesetzt ist
  sleep_low_bat_min: "1440"      # Minuten bei schwachem Akku
  low_bat_voltage: "3.30"        # V; darunter nur noch selten aufwachen (DW01 schuetzt erst bei ~2.4 V)
  samples: "15"                  # Messungen, davon der Median (Akku egal bei 1 Messzyklus/h)

  max_range: "2.0"               # m; TOF200C (VL53L0X), laengere Werte (z. B. 8.19) sind Fehlmessungen

  # Tank: Abstaende in Metern ab Sensorunterkante (Sensor sitzt ca. 8 mm ueber der Verschlussoberseite, Messen!)
  # Tank 163 x 70 x 200 cm (H x B x L), Oeffnung mittig in der Breite, 30 cm von der Stirnwand, 10 cm Kragen
  dist_empty: "1.50"             # Abstand Sensor -> Tankboden (Fuellstand 0 %), max. ca. 1.8
  dist_full: "0.10"              # Abstand Sensor -> Oberflaeche bei 100 % (mind. 0.05)
  capacity: "1960"               # Liter bei 100 % (linear): 0.70 m x 2.00 m x (1.50 - 0.10) m

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0         # aeltere Versionen blockieren on_boot bis WLAN verbunden ist
  on_boot:
    priority: -100
    then:
      - script.execute: measure_and_sleep

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true                # HA legt die Entitaeten automatisch an
  discovery_retain: true
  publish_nan_as_none: true      # Fehlmessung -> HA zeigt "unbekannt" statt der Zahl "nan"
  # Kein birth/will/shutdown: sonst waeren die Sensoren in HA waehrend des Schlafs "nicht verfuegbar".
  birth_message:
  will_message:
  shutdown_message:
  log_topic: null                # Logs nur per USB, spart Zeit in der Wachphase
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true             # nur ein AP: spart Scan-Zeit und damit Akku
  enable_on_boot: false          # erst messen, dann funken: kein WLAN-Strom waehrend der Sensor anlaeuft
  reboot_timeout: 5min           # Notbremse, normal schlaeft das Geraet lange vorher
  # Feste IP verkuerzt die Wachphase weiter:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

deep_sleep:
  id: deep_sleep_1
  sleep_duration: ${sleep_default_min}min   # nur Vorgabe, der Wert wird vor dem Schlafen ueberschrieben

globals:
  - id: sleep_min_eff
    type: int
    initial_value: ${sleep_default_min}
  - id: buf
    type: std::vector<float>

# Der ToF-Sensor haengt dauerhaft an 3V3 (VIN) und am I2C-Bus. XSHUT (GPIO5) ist die Enable-Leitung: ESPHome setzt
# sie beim Start auf high (Sensor an, Adresse 0x29). Im Deep Sleep floatet der Pin, der Pulldown Rxs am Lochraster
# zieht ihn auf low = Sensor im Standby (Sparmodus). Kurze Leitungen im Gehaeuse, daher 100 kHz.
# GPIO1/INT des Moduls liegt auf GPIO4 (mit Pullup Rint), wird hier nicht benutzt.

i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz
  scan: false

text_sensor:
  # OTA-Modus: retained Nachricht "ON"/"OFF" auf ${name}/ota_mode (z. B. MQTT-Schalter in HA)
  - platform: mqtt_subscribe
    id: ota_mode
    topic: ${name}/ota_mode
    internal: true
  # Rueckmeldung: was gilt gerade (nach dem Aufwachen gesetzt, retained)
  - platform: template
    id: mode_status
    name: Modus
    icon: mdi:power-sleep

sensor:
  # Schlafdauer-Vorgabe: retained Zahl in Minuten auf ${name}/sleep_minutes
  - platform: mqtt_subscribe
    id: sleep_cfg
    topic: ${name}/sleep_minutes
    internal: true
  - platform: template
    id: sleep_active
    name: Schlafdauer aktiv
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
  # Rohmessung, nur intern; jeder Wert landet im Puffer, der Median wird unten berechnet
  - platform: vl53l0x
    id: tof
    address: 0x29
    enable_pin: GPIO5            # XSHUT
    long_range: true             # bis ca. 2 m, dafuer etwas mehr Rauschen
    signal_rate_limit: 0.1       # MCPS; niedriger als Standard (0.25) = empfindlicher bei dunkler Oelflaeche
    timeout: 200ms
    update_interval: never
    internal: true
    on_value:
      - lambda: if (!std::isnan(x) && x <= ${max_range}) id(buf).push_back(x);

  - platform: template
    id: dist
    name: Abstand
    unit_of_measurement: m
    accuracy_decimals: 3
    device_class: distance
    state_class: measurement
    update_interval: never
  - platform: template
    id: level
    name: Füllstand
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never
  - platform: template
    id: liters
    name: Inhalt
    unit_of_measurement: L
    accuracy_decimals: 0
    device_class: volume_storage
    state_class: measurement
    update_interval: never

  # Akku: Teiler 1M/1M an GPIO1 (ADC1, funktioniert parallel zu WLAN)
  - platform: adc
    id: vbat
    internal: true               # Rohwert x2; gesendet wird vbat_v (ohne Filter, darf erneut gesendet werden)
    pin: GPIO1
    attenuation: 12db
    samples: 16
    update_interval: never
    filters:
      - multiply: 2.0
  - platform: template
    id: vbat_v
    name: Akkuspannung
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: bat_pct
    name: Akku
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: wifi_signal
    name: WLAN Signal
    update_interval: never
    id: rssi

script:
  # Schlafdauer aus ${name}/sleep_minutes (1..1440), bei schwachem Akku die lange Pause; meldet den Wert zurueck
  - id: apply_sleep
    then:
      - lambda: |-
          float v = id(vbat).state;
          bool low = !std::isnan(v) && v > 2.5f && v < ${low_bat_voltage};
          float m = id(sleep_cfg).has_state() ? id(sleep_cfg).state : ${sleep_default_min};
          if (std::isnan(m)) m = ${sleep_default_min};
          m = std::max(1.0f, std::min(1440.0f, m));
          if (low) ESP_LOGW("sleep", "Akku schwach: lange Pause");
          id(sleep_min_eff) = low ? ${sleep_low_bat_min} : (int) std::lround(m);
          id(sleep_active).publish_state(id(sleep_min_eff));

  - id: measure_and_sleep
    mode: single
    then:
      # 1) Messen. Ausreisser und Fehlmessungen (Timeout, > max_range) verwirft der Median.
      - repeat:
          count: ${samples}
          then:
            - component.update: tof
            - delay: 250ms
      # 2) Median und Fuellstand berechnen
      - lambda: |-
          static_assert(${dist_empty} > ${dist_full}, "dist_empty muss groesser als dist_full sein");
          auto median = [](std::vector<float> v) -> float {
            if (v.empty()) return NAN;
            std::sort(v.begin(), v.end());
            size_t n = v.size();
            return n % 2 ? v[n / 2] : (v[n / 2 - 1] + v[n / 2]) / 2.0f;
          };
          ESP_LOGI("tank", "%u gueltige Messungen von ${samples}", (unsigned) id(buf).size());
          float d = median(id(buf));
          id(dist).publish_state(d);
          if (std::isnan(d)) {
            id(level).publish_state(NAN);
            id(liters).publish_state(NAN);
          } else {
            float lvl = (${dist_empty} - d) / (${dist_empty} - ${dist_full});
            lvl = std::max(0.0f, std::min(1.0f, lvl));
            id(level).publish_state(lvl * 100.0f);
            id(liters).publish_state(lvl * ${capacity});
          }
      # 3) Akku (Sensor ist im Leerlauf, kaum Last)
      - component.update: vbat
      - lambda: |-
          float v = id(vbat).state;
          if (std::isnan(v) || v < 2.5f) {   // Teiler nicht bestueckt / Pin offen
            ESP_LOGW("bat", "Akkuspannung unplausibel (%.2f V), Teiler fehlt?", v);
            id(vbat_v).publish_state(NAN);
            id(bat_pct).publish_state(NAN);
            return;
          }
          id(vbat_v).publish_state(v);
          const float empty = ${low_bat_voltage};
          float pct = (v - empty) / (4.15f - empty) * 100.0f;
          id(bat_pct).publish_state(std::max(0.0f, std::min(100.0f, pct)));
      # 4) WLAN ein, mit dem MQTT-Broker verbinden und alle Werte (retained) publishen
      - wifi.enable:
      - wait_until:
          condition:
            mqtt.connected:
          # Timer-Aufwachen: 30 s. Einschalten/RST/Flashen: 60 s
          timeout: !lambda 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER ? 30000 : 60000;'
      - component.update: rssi
      - delay: 1s                # Discovery-Nachrichten gehen zuerst raus
      - lambda: |-
          // Werte nach dem Verbinden nochmals senden, damit sie sicher beim Broker ankommen
          // nur Template-Sensoren (ohne Filter), sonst wuerden Filter doppelt angewendet
          for (auto *s : {id(dist), id(level), id(liters), id(vbat_v), id(bat_pct)})
            if (s->has_state()) s->publish_state(s->state);
      - wait_until:              # retained ota_mode und sleep_minutes kommen direkt nach dem Abonnieren
          condition:
            lambda: return id(ota_mode).has_state() && id(sleep_cfg).has_state();
          timeout: 3s            # nie gesetzt -> OTA gilt als OFF, Schlafdauer als Vorgabe
      - lambda: id(mode_status).publish_state(id(ota_mode).has_state() && id(ota_mode).state == "ON" ? "OTA aktiv" : "Normal");
      - script.execute: apply_sleep
      - delay: 1s                # MQTT-Sendepuffer leeren
      # 5) Schlafen, ausser OTA-Modus ist aktiv
      - if:
          condition:
            lambda: return id(ota_mode).has_state() && id(ota_mode).state == "ON";
          then:
            - logger.log: "OTA-Modus aktiv: bleibe wach, bis ota_mode OFF ist (max. 30 min)"
            - wait_until:
                condition:
                  lambda: return id(ota_mode).state != "ON";
                timeout: 30min
            - logger.log: "OTA-Modus beendet: Deep Sleep"
            - lambda: id(mode_status).publish_state("Normal");
            - script.execute: apply_sleep   # Schlafdauer evtl. waehrend OTA geaendert
            - delay: 1s
      - deep_sleep.enter:
          id: deep_sleep_1
          sleep_duration: !lambda 'return (uint32_t) id(sleep_min_eff) * 60000UL;'
