# ESPHome: ESP32-C3 SuperMini + 2x JSN-SR04T V3.0 + 18650, Deep Sleep
# Hardware siehe ../README.md
#
# Ablauf pro Wachphase:
#   (WLAN noch aus) je N Messungen pro Sensor, Median -> Akkuspannung
#   -> WLAN ein -> MQTT verbinden -> Werte (retained) publishen -> Deep Sleep
# Home Assistant legt die Sensoren per MQTT-Discovery automatisch an.
# OTA (Firmware-Update per WLAN): retained "ON" auf ${name}/ota_mode publishen, dann bleibt das
#      Geraet nach der naechsten Wachphase wach (max. 30 min). "OFF" -> sofort Deep Sleep.
# Nach dem Timer-Aufwachen wartet es max. 30 s auf den Broker, nach Einschalten/RST 60 s.

substitutions:
  name: tankmonitor
  friendly_name: Tankmonitor
  sleep_duration: 60min
  sleep_duration_low_bat: 24h
  low_bat_voltage: "3.30"        # V; darunter nur noch selten aufwachen (DW01 schuetzt erst bei ~2.4 V)
  samples: "7"                   # Messungen pro Sensor, davon der Median

  # Tank 1 (JSN #1) - Abstaende in Metern ab Sensorunterkante
  t1_name: Tank 1
  t1_dist_empty: "1.60"          # Abstand Sensor -> Tankboden (Fuellstand 0 %)
  t1_dist_full: "0.30"           # Abstand Sensor -> Oberflaeche bei 100 % (mind. 0.25, Blindzone 21 cm)
  t1_capacity: "1500"            # Liter bei 100 % (linear, gilt fuer senkrechte Waende)
  # Tank 2 (JSN #2)
  t2_name: Tank 2
  t2_dist_empty: "1.60"
  t2_dist_full: "0.30"
  t2_capacity: "1500"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0         # aeltere Versionen blockieren on_boot bis WLAN verbunden ist
  on_boot:
    priority: -100
    then:
      - script.execute: measure_and_sleep

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true                # HA legt die Entitaeten automatisch an
  discovery_retain: true
  publish_nan_as_none: true      # Fehlmessung -> HA zeigt "unbekannt" statt der Zahl "nan"
  # Kein birth/will/shutdown: sonst waeren die Sensoren in HA waehrend des Schlafs "nicht verfuegbar".
  birth_message:
  will_message:
  shutdown_message:
  log_topic: null                # Logs nur per USB, spart Zeit in der Wachphase
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true             # nur ein AP: spart Scan-Zeit und damit Akku
  enable_on_boot: false          # erst messen, dann funken: kein WLAN-Strom waehrend Sensoren anlaufen
  reboot_timeout: 5min           # Notbremse, normal schlaeft das Geraet lange vorher
  # Feste IP verkuerzt die Wachphase weiter:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

deep_sleep:
  id: deep_sleep_1
  sleep_duration: ${sleep_duration}

globals:
  - id: buf1
    type: std::vector<float>
  - id: buf2
    type: std::vector<float>

# Sensoren haengen dauerhaft an 3V3 und laufen im Low-Power-Modus 4 (360k auf dem Mode-Loetfeld,
# Ruhestrom < 70 uA je Sensor). 120k-Pulldowns (R5/R6) halten TRIG im Deep Sleep auf LOW.

text_sensor:
  # OTA-Modus: retained Nachricht "ON"/"OFF" auf ${name}/ota_mode (z. B. MQTT-Schalter in HA)
  - platform: mqtt_subscribe
    id: ota_mode
    topic: ${name}/ota_mode
    internal: true

sensor:
  # Rohmessungen, nur intern; jeder Wert landet im Puffer, der Median wird unten berechnet
  - platform: ultrasonic
    id: us1
    trigger_pin: GPIO6
    echo_pin: GPIO7
    pulse_time: 20us             # JSN braucht > 10 us
    timeout: 4m
    update_interval: never
    internal: true
    on_value:
      - lambda: if (!std::isnan(x)) id(buf1).push_back(x);
  - platform: ultrasonic
    id: us2
    trigger_pin: GPIO20
    echo_pin: GPIO10
    pulse_time: 20us
    timeout: 4m
    update_interval: never
    internal: true
    on_value:
      - lambda: if (!std::isnan(x)) id(buf2).push_back(x);

  - platform: template
    id: dist1
    name: ${t1_name} Abstand
    unit_of_measurement: m
    accuracy_decimals: 3
    device_class: distance
    state_class: measurement
    update_interval: never
  - platform: template
    id: level1
    name: ${t1_name} Füllstand
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never
  - platform: template
    id: liters1
    name: ${t1_name} Inhalt
    unit_of_measurement: L
    accuracy_decimals: 0
    device_class: volume_storage
    state_class: measurement
    update_interval: never

  - platform: template
    id: dist2
    name: ${t2_name} Abstand
    unit_of_measurement: m
    accuracy_decimals: 3
    device_class: distance
    state_class: measurement
    update_interval: never
  - platform: template
    id: level2
    name: ${t2_name} Füllstand
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never
  - platform: template
    id: liters2
    name: ${t2_name} Inhalt
    unit_of_measurement: L
    accuracy_decimals: 0
    device_class: volume_storage
    state_class: measurement
    update_interval: never

  # Akku: Teiler 1M/1M an GPIO1 (ADC1, funktioniert parallel zu WLAN)
  - platform: adc
    id: vbat
    internal: true               # Rohwert x2; gesendet wird vbat_v (ohne Filter, darf erneut gesendet werden)
    pin: GPIO1
    attenuation: 12db
    samples: 16
    update_interval: never
    filters:
      - multiply: 2.0
  - platform: template
    id: vbat_v
    name: Akkuspannung
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: bat_pct
    name: Akku
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: wifi_signal
    name: WLAN Signal
    update_interval: never
    id: rssi

script:
  - id: measure_and_sleep
    mode: single
    then:
      # 1+2) Nacheinander messen (nie gleichzeitig: Uebersprechen), >= 60 ms Abstand laut Datenblatt.
      #      Faellt die erste Messung nach dem Aufwachen aus Modus 4 aus, verwirft der Median sie.
      - repeat:
          count: ${samples}
          then:
            - component.update: us1
            - delay: 100ms
      - repeat:
          count: ${samples}
          then:
            - component.update: us2
            - delay: 100ms
      # 3) Median und Fuellstand berechnen
      - lambda: |-
          static_assert(${t1_dist_empty} > ${t1_dist_full}, "t1_dist_empty muss groesser als t1_dist_full sein");
          static_assert(${t2_dist_empty} > ${t2_dist_full}, "t2_dist_empty muss groesser als t2_dist_full sein");
          auto median = [](std::vector<float> v) -> float {
            if (v.empty()) return NAN;
            std::sort(v.begin(), v.end());
            size_t n = v.size();
            return n % 2 ? v[n / 2] : (v[n / 2 - 1] + v[n / 2]) / 2.0f;
          };
          auto publish = [](float d, float empty, float full, float cap,
                            template_::TemplateSensor *ds, template_::TemplateSensor *ls,
                            template_::TemplateSensor *vs) {
            ds->publish_state(d);
            if (std::isnan(d)) { ls->publish_state(NAN); vs->publish_state(NAN); return; }
            float lvl = (empty - d) / (empty - full);
            lvl = std::max(0.0f, std::min(1.0f, lvl));
            ls->publish_state(lvl * 100.0f);
            vs->publish_state(lvl * cap);
          };
          ESP_LOGI("tank", "Tank 1: %u gueltige Messungen, Tank 2: %u",
                   (unsigned) id(buf1).size(), (unsigned) id(buf2).size());
          publish(median(id(buf1)), ${t1_dist_empty}, ${t1_dist_full}, ${t1_capacity},
                  id(dist1), id(level1), id(liters1));
          publish(median(id(buf2)), ${t2_dist_empty}, ${t2_dist_full}, ${t2_capacity},
                  id(dist2), id(level2), id(liters2));
      # 4) Akku (Sensoren im Modus-4-Ruhezustand = kaum Last)
      - component.update: vbat
      - lambda: |-
          float v = id(vbat).state;
          if (std::isnan(v) || v < 2.5f) {   // Teiler nicht bestueckt / Pin offen
            ESP_LOGW("bat", "Akkuspannung unplausibel (%.2f V), Teiler fehlt?", v);
            id(vbat_v).publish_state(NAN);
            id(bat_pct).publish_state(NAN);
            return;
          }
          id(vbat_v).publish_state(v);
          const float empty = ${low_bat_voltage};
          float pct = (v - empty) / (4.15f - empty) * 100.0f;
          id(bat_pct).publish_state(std::max(0.0f, std::min(100.0f, pct)));
      # 5) WLAN ein, mit dem MQTT-Broker verbinden und alle Werte (retained) publishen
      - wifi.enable:
      - wait_until:
          condition:
            mqtt.connected:
          # Timer-Aufwachen: 30 s. Einschalten/RST/Flashen: 60 s
          timeout: !lambda 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER ? 30000 : 60000;'
      - component.update: rssi
      - delay: 1s                # Discovery-Nachrichten gehen zuerst raus
      - lambda: |-
          // Werte nach dem Verbinden nochmals senden, damit sie sicher beim Broker ankommen
          // nur Template-Sensoren (ohne Filter), sonst wuerden Filter doppelt angewendet
          for (auto *s : {id(dist1), id(level1), id(liters1), id(dist2), id(level2), id(liters2),
                          id(vbat_v), id(bat_pct)})
            if (s->has_state()) s->publish_state(s->state);
      - wait_until:              # retained ota_mode kommt direkt nach dem Abonnieren
          condition:
            lambda: return id(ota_mode).has_state();
          timeout: 3s            # nie gesetzt -> gilt als OFF
      - delay: 1s                # MQTT-Sendepuffer leeren
      # 6) Schlafen, ausser OTA-Modus ist aktiv
      - if:
          condition:
            lambda: return id(ota_mode).has_state() && id(ota_mode).state == "ON";
          then:
            - logger.log: "OTA-Modus aktiv: bleibe wach, bis ota_mode OFF ist (max. 30 min)"
            - wait_until:
                condition:
                  lambda: return id(ota_mode).state != "ON";
                timeout: 30min
            - logger.log: "OTA-Modus beendet: Deep Sleep"
            - deep_sleep.enter: deep_sleep_1
          else:
            - if:
                condition:
                  lambda: return !std::isnan(id(vbat).state) && id(vbat).state > 2.5f && id(vbat).state < ${low_bat_voltage};
                then:
                  - logger.log: "Akku schwach: lange Pause"
                  - deep_sleep.enter:
                      id: deep_sleep_1
                      sleep_duration: ${sleep_duration_low_bat}
                else:
                  - deep_sleep.enter: deep_sleep_1
